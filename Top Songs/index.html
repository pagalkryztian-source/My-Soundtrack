<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Soundtrack • Premium Music Showcase</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    /* ==========================================================================
       RESET & ROOT VARIABLES (HARDWARE ACCELERATED)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg-base: #030305;
      --bg-surface: rgba(10, 10, 15, 0.7);
      --bg-card: rgba(18, 18, 25, 0.85);
      --bg-hover: rgba(35, 35, 45, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.3);
      --accent-primary: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.5);
      --text-main: #f5f5f5;
      --text-muted: #8a8a95;
      --sidebar-width: 280px;
      --header-height: 72px;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      --glass-blur: blur(16px);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      line-height: 1.5;
      position: relative;
    }

    /* Animated Ambient Background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, #151525 0%, #030305 40%, #000000 100%);
      z-index: -1;
      animation: ambientDrift 20s ease-in-out infinite alternate;
    }
    
    @keyframes ambientDrift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(2%, 2%) scale(1.05); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ==========================================================================
       LAYOUT & SIDEBAR (GLASSMORPHISM)
       ========================================================================== */
    .app-container { display: flex; width: 100%; min-height: 100vh; position: relative; z-index: 1; }
    
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: var(--glass-blur); z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity var(--transition-smooth);
    }
    .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

    aside.sidebar {
      width: var(--sidebar-width); 
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--border-color); 
      display: flex; flex-direction: column;
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 250;
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);
      box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    .sidebar-header {
      padding: 24px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-brand { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
    .sidebar-brand i { font-size: 1.4rem; color: var(--accent-primary); filter: drop-shadow(0 0 8px var(--accent-glow)); }
    
    .close-sidebar-btn {
      background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; display: none; transition: color var(--transition-fast);
    }
    .close-sidebar-btn:hover { color: var(--accent-primary); }

    .sidebar-search { padding: 20px 24px 10px; }
    .sidebar-search-box { position: relative; }
    .sidebar-search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }
    .sidebar-search-box input {
      width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 10px 14px 10px 38px; color: var(--text-main); font-size: 0.85rem; outline: none; transition: all var(--transition-fast);
    }
    .sidebar-search-box input:focus { border-color: var(--border-focus); background: rgba(0,0,0,0.6); box-shadow: 0 0 10px rgba(255,255,255,0.05); }

    .sidebar-menu-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-weight: 800; padding: 16px 24px 8px; }
    
    .artist-nav-list { list-style: none; overflow-y: auto; flex: 1; padding: 0 16px 24px; }
    .artist-nav-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px;
      color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all var(--transition-fast); margin-bottom: 4px;
    }
    .artist-nav-item:hover, .artist-nav-item.active { background: rgba(255,255,255,0.08); color: var(--text-main); transform: translateX(4px); }
    .artist-nav-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
    .artist-nav-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ==========================================================================
       MAIN CONTENT
       ========================================================================== */
    .main-wrapper { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-width: 0; transition: margin-left var(--transition-smooth); }

    header.top-header {
      height: var(--header-height); background: rgba(5, 5, 8, 0.6); backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }

    .header-left { display: flex; align-items: center; gap: 20px; flex: 1; }
    .toggle-sidebar-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-main);
      width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition-fast);
    }
    .toggle-sidebar-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--border-focus); transform: scale(1.05); }

    .global-search { position: relative; width: 100%; max-width: 450px; }
    .global-search i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
    .global-search input {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
      border-radius: 24px; padding: 12px 20px 12px 46px; color: var(--text-main); font-size: 0.9rem; outline: none; transition: all var(--transition-fast);
      backdrop-filter: blur(4px);
    }
    .global-search input:focus { border-color: var(--border-focus); background: rgba(0,0,0,0.6); box-shadow: 0 0 15px rgba(255,255,255,0.05); }

    .header-stats { display: flex; gap: 12px; }
    .stat-pill {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-muted);
      padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(4px); text-transform: uppercase; letter-spacing: 1px;
    }
    .stat-pill span { color: var(--text-main); font-size: 0.85rem; }

    main.content-area { max-width: 1600px; width: 100%; margin: 0 auto; padding: 40px; flex: 1; }

    /* ==========================================================================
       HERO & FILTERS
       ========================================================================== */
    .hero-banner { margin-bottom: 40px; animation: fadeDown 0.6s ease-out; }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    
    .hero-banner h2 { 
      font-size: 3rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 12px; 
      background: linear-gradient(90deg, #ffffff, #8a8a95);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-banner p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; font-weight: 400; }

    .quick-chips-container {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 20px; margin-bottom: 32px; scrollbar-width: none;
    }
    .quick-chips-container::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); color: var(--text-muted);
      padding: 10px 24px; border-radius: 24px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all var(--transition-fast);
      backdrop-filter: blur(4px);
    }
    .chip-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); transform: translateY(-2px); }
    .chip-btn.active { background: var(--accent-primary); color: #000; border-color: var(--accent-primary); box-shadow: 0 4px 15px rgba(255,255,255,0.2); }

    /* ==========================================================================
       MUSIC GRID & CARDS (WITH 3D HOVER EFFECTS)
       ========================================================================== */
    .artist-section { margin-bottom: 64px; scroll-margin-top: calc(var(--header-height) + 32px); content-visibility: auto; contain-intrinsic-size: 500px; }
    
    .artist-header-card {
      display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);
    }
    .artist-avatar-lg { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .artist-meta h3 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
    .artist-meta span { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px; }

    .music-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; transition: all var(--transition-smooth);
      backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px);
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    
    .music-card:hover { 
      border-color: rgba(255,255,255,0.2); 
      transform: translateY(-8px) scale(1.02); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(255, 255, 255, 0.05);
      z-index: 10;
    }

    .video-facade-container {
      position: relative; width: 100%; padding-top: 56.25%; background-color: #050505; cursor: pointer; overflow: hidden;
    }
    .video-facade-container img.thumbnail {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0;
    }
    .video-facade-container img.thumbnail.loaded { opacity: 1; }
    .music-card:hover .video-facade-container img.thumbnail { transform: scale(1.08); }

    /* Animated Play Button */
    .play-overlay-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 56px; height: 56px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; transition: all var(--transition-fast); padding-left: 4px;
      box-shadow: 0 0 0 0 rgba(255,255,255,0.4);
    }
    .video-facade-container:hover .play-overlay-btn { 
      background: #fff; color: #000; 
      transform: translate(-50%, -50%) scale(1.15); 
      animation: pulsePlay 1.5s infinite;
    }
    @keyframes pulsePlay {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
      70% { box-shadow: 0 0 0 15px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    
    .video-facade-container iframe, .video-facade-container div[id^="yt-"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .card-body { padding: 24px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 1.1rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-artist-name { font-size: 0.85rem; color: var(--accent-glow); margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

    /* ==========================================================================
       COMMENTS SYSTEM UI
       ========================================================================== */
    .card-footer {
      margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
    }
    .action-btn {
      background: transparent; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all var(--transition-fast); font-family: inherit;
    }
    .action-btn:hover { color: var(--text-main); transform: translateY(-1px); }
    
    .comments-panel {
      display: none; flex-direction: column; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed rgba(255,255,255,0.1); animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .comments-panel.open { display: flex; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    
    .comment-list { display: flex; flex-direction: column; gap: 12px; max-height: 140px; overflow-y: auto; padding-right: 4px; }
    .comment-item { background: rgba(0,0,0,0.3); padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.03); }
    .comment-author { font-weight: 800; color: var(--accent-primary); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .comment-date { color: var(--text-muted); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.5px; text-transform: uppercase; }
    
    .comment-input-area { display: flex; gap: 8px; margin-top: 4px; }
    .comment-input-area input {
      flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: var(--text-main); font-size: 0.85rem; outline: none; font-family: inherit; transition: all var(--transition-fast);
    }
    .comment-input-area input:focus { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 10px rgba(255,255,255,0.05); }
    .comment-input-area button {
      background: var(--accent-primary); color: #000; border: none; border-radius: 8px; padding: 0 16px; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: all var(--transition-fast);
    }
    .comment-input-area button:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(255,255,255,0.2); }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 100px 20px; border-radius: 16px; background: rgba(0,0,0,0.2); border: 1px dashed var(--border-color); }
    .empty-state i { font-size: 3rem; color: rgba(255,255,255,0.1); margin-bottom: 20px; }
    .empty-state h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    .empty-state p { color: var(--text-muted); font-size: 1rem; }

    footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); }

    /* ==========================================================================
       RESPONSIVE MOBILE DESIGN
       ========================================================================== */
    @media (max-width: 1024px) {
      aside.sidebar { transform: translateX(-100%); }
      aside.sidebar.mobile-open { transform: translateX(0); }
      .close-sidebar-btn { display: block; }
      .main-wrapper { margin-left: 0; }
    }
    @media (max-width: 640px) {
      header.top-header { padding: 0 20px; }
      main.content-area { padding: 24px 20px; }
      .hero-banner h2 { font-size: 2rem; }
      .header-stats { display: none; }
      .music-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

      <main class="content-area">

        <div class="quick-chips-container" id="quickChipsContainer"></div>
        <div id="musicContainer"></div>
      </main>

      <footer><p>&copy; 2026 Personal Soundtrack Showcase • Engineered for Speed.</p></footer>

    /* ==========================================================================
       2. DSA: INVERTED INDEX ENGINE FOR O(K) FAST SEARCHING
       ========================================================================== */
    class SearchEngine {
      constructor() {
        this.index = new Map();
        this.allIds = new Set();
      }
      
      tokenize(str) {
        return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
      }

      buildIndex(data) {
        data.forEach((artistObj, aIndex) => {
          artistObj.songs.forEach((song, sIndex) => {
            const docId = `${aIndex}-${sIndex}`;
            this.allIds.add(docId);
            const tokens = this.tokenize(`${artistObj.artist} ${song.title}`);
            
            // Build n-grams/substrings for autocomplete capabilities
            tokens.forEach(token => {
              for (let i = 1; i <= token.length; i++) {
                const prefix = token.substring(0, i);
                if (!this.index.has(prefix)) this.index.set(prefix, new Set());
                this.index.get(prefix).add(docId);
              }
            });
          });
        });
      }

      search(query) {
        if (!query.trim()) return Array.from(this.allIds);
        const tokens = this.tokenize(query);
        if (tokens.length === 0) return Array.from(this.allIds);
        
        let resultIds = null;
        for (const token of tokens) {
          const matchSet = this.index.get(token);
          if (!matchSet) return []; // AND logic: if one token misses, return empty
          if (!resultIds) {
            resultIds = new Set(matchSet);
          } else {
            resultIds = new Set([...resultIds].filter(x => matchSet.has(x)));
          }
        }
        return Array.from(resultIds);
      }
    }

    const searchEngine = new SearchEngine();
    let selectedFilter = "ALL";
    let ytPlayers = {}; 

    /* ==========================================================================
       3. SYSTEM INITIALIZATION & PERFORMANCE OBSERVERS
       ========================================================================== */
    
    // Intersection Observer for O(1) Lazy Loading Memory Management
    const lazyImageObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          img.onload = () => img.classList.add('loaded');
          observer.unobserve(img);
        }
      });
    }, { rootMargin: "200px 0px" });

    function initSystem() {
      searchEngine.buildIndex(artistsData);
      
      let trackCount = 0;
      artistsData.forEach(a => trackCount += a.songs.length);
      document.getElementById("totalArtistsBadge").textContent = artistsData.length;
      document.getElementById("totalTracksBadge").textContent = trackCount;

      renderSidebar();
      renderChips();
      
      // Global Event Delegation for dynamic elements
      document.getElementById("musicContainer").addEventListener("click", e => {
        const facade = e.target.closest('.video-facade-container');
        if (facade) playVideo(facade);
        
        const toggleBtn = e.target.closest('.toggle-comments-btn');
        if (toggleBtn) toggleComments(toggleBtn.dataset.vid);
      });
    }

    /* ==========================================================================
       4. BATCH DOM RENDERING (Hardware Accelerated)
       ========================================================================== */
    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function renderPlaylists(query = "") {
      requestAnimationFrame(() => {
        const container = document.getElementById("musicContainer");
        const docFrag = document.createDocumentFragment();
        
        const matchedDocIds = searchEngine.search(query);
        const matchSet = new Set(matchedDocIds);
        
        let totalMatches = 0;

        artistsData.forEach((artist, aIndex) => {
          if (selectedFilter !== "ALL" && aIndex.toString() !== selectedFilter) return;

          const activeSongs = artist.songs.filter((_, sIndex) => matchSet.has(`${aIndex}-${sIndex}`));
          if (activeSongs.length === 0) return;

          totalMatches += activeSongs.length;
          const section = document.createElement("section");
          section.className = "artist-section";
          section.id = `artist-${aIndex}`;

          let html = `
            <div class="artist-header-card">
              <img src="${artist.image}" alt="${escapeHTML(artist.artist)}" class="artist-avatar-lg" loading="lazy" />
              <div class="artist-meta">
                <h3>${escapeHTML(artist.artist)}</h3>
                <span>${activeSongs.length} Track${activeSongs.length > 1 ? 's' : ''}</span>
              </div>
            </div>
            <div class="music-grid">
          `;

          activeSongs.forEach((track, idx) => {
            const cleanId = track.id.replace('?', '');
            const safeTitle = escapeHTML(track.title);
            
            // Build Comments HTML
            let commentsHTML = track.comments.map(c => `
              <div class="comment-item">
                <div class="comment-author">${escapeHTML(c.author)} <span class="comment-date">${c.date}</span></div>
                <div>${escapeHTML(c.text)}</div>
              </div>
            `).join('');

            // FIX: Using hqdefault.jpg to entirely bypass the gray default placeholder issue on YouTube (100% video support)
            html += `
              <div class="music-card" style="animation-delay: ${idx * 0.1}s">
                <div class="video-facade-container" data-vid="${cleanId}" data-title="${safeTitle}">
                  <img data-src="https://img.youtube.com/vi/${cleanId}/hqdefault.jpg" onerror="this.onerror=null; this.src='https://img.youtube.com/vi/${cleanId}/mqdefault.jpg';" alt="${safeTitle}" class="thumbnail" />
                  <div class="play-overlay-btn"><i class="fa-solid fa-play"></i></div>
                </div>
                <div class="card-body">
                  <h4 class="card-title">${safeTitle}</h4>
                  <div class="card-artist-name"><i class="fa-solid fa-microphone-lines" style="font-size: 0.8rem;"></i> ${escapeHTML(artist.artist)}</div>
                  <div class="card-footer">
                    <button class="action-btn toggle-comments-btn" data-vid="${cleanId}"><i class="fa-regular fa-comment-dots"></i> Comment</button>
                    <i class="fa-brands fa-youtube" style="color: rgba(255,255,255,0.2); font-size: 1.4rem;"></i>
                  </div>
                  <div class="comments-panel" id="comments-${cleanId}">
                    <div class="comment-list" id="list-${cleanId}">${commentsHTML}</div>
                    <div class="comment-input-area">
                      <input type="text" id="input-${cleanId}" placeholder="Add a comment..." onkeypress="if(event.key === 'Enter') addComment('${cleanId}')">
                      <button onclick="addComment('${cleanId}')"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          });

          html += `</div>`;
          section.innerHTML = html;
          docFrag.appendChild(section);
        });

        container.innerHTML = "";
        if (totalMatches === 0) {
          container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-compact-disc"></i><h3>No matches found</h3><p>Try refining your search terms.</p></div>`;
        } else {
          container.appendChild(docFrag);
          // Apply lazy loading to newly created images
          container.querySelectorAll('.thumbnail').forEach(img => lazyImageObserver.observe(img));
        }
      });
    }

    /* ==========================================================================
       5. COMMENTS LOGIC (STATIC MEMORY)
       ========================================================================== */
    function toggleComments(vid) {
      const panel = document.getElementById(`comments-${vid}`);
      panel.classList.toggle('open');
    }

    function addComment(vid) {
      const input = document.getElementById(`input-${vid}`);
      const text = input.value.trim();
      if (!text) return;

      const list = document.getElementById(`list-${vid}`);
      const dateStr = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(new Date());
      
      const newComment = document.createElement('div');
      newComment.className = 'comment-item';
      newComment.innerHTML = `<div class="comment-author">Guest <span class="comment-date">${dateStr}</span></div><div>${escapeHTML(text)}</div>`;
      
      list.appendChild(newComment);
      input.value = '';
      
      // Persist to static memory object
      artistsData.forEach(a => {
        const song = a.songs.find(s => s.id === vid);
        if (song) song.comments.push({ author: "Guest", text, date: dateStr });
      });
    }

    /* ==========================================================================
       6. YOUTUBE API WITH AD-MITIGATION PARAMS
       ========================================================================== */
    function playVideo(container) {
      const videoId = container.getAttribute('data-vid');
      const title = container.getAttribute('data-title');
      const existingPlayerId = container.getAttribute('data-player-id');

      if (existingPlayerId && ytPlayers[existingPlayerId]) {
        try { ytPlayers[existingPlayerId].playVideo(); return; } catch (e) {}
      }

      // O(N) cleanup of currently playing videos
      Object.values(ytPlayers).forEach(p => {
        if (p && typeof p.pauseVideo === 'function') try { p.pauseVideo(); } catch (e) {}
      });

      const playerId = 'yt-' + Math.random().toString(36).substring(2, 10);
      container.setAttribute('data-player-id', playerId);
      container.innerHTML = `<div id="${playerId}"></div>`;

      // AD-MITIGATION: rel=0 (no related outside channel), modestbranding=1 (remove logo), iv_load_policy=3 (remove annotations)
      if (window.YT && YT.Player) {
        ytPlayers[playerId] = new YT.Player(playerId, {
          videoId: videoId,
          playerVars: { 'autoplay': 1, 'rel': 0, 'modestbranding': 1, 'iv_load_policy': 3, 'playsinline': 1, 'enablejsapi': 1 },
          events: {
            'onReady': e => e.target.playVideo(),
            'onStateChange': e => { if (e.data === YT.PlayerState.ENDED) playNextVideo(container); }
          }
        });
      } else {
        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&enablejsapi=1" title="${title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      }
    }

    function playNextVideo(currentContainer) {
      const allFacades = Array.from(document.querySelectorAll('.video-facade-container'));
      const currentIndex = allFacades.indexOf(currentContainer);
      if (currentIndex !== -1 && currentIndex + 1 < allFacades.length) {
        const nextFacade = allFacades[currentIndex + 1];
        nextFacade.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => playVideo(nextFacade), 500);
      }
    }

    /* ==========================================================================
       7. UI / EVENT HANDLERS
       ========================================================================== */
    function renderSidebar(filterQuery = "") {
      const list = document.getElementById("artistNavList");
      const q = filterQuery.toLowerCase();
      let html = "";
      
      artistsData.forEach((a, idx) => {
        if (!q || a.artist.toLowerCase().includes(q)) {
          const active = selectedFilter === idx.toString() ? "active" : "";
          html += `<li><a class="artist-nav-item ${active}" onclick="selectArtist('${idx}')">
            <img src="${a.image}" alt="${escapeHTML(a.artist)}" class="artist-nav-avatar" loading="lazy" />
            <span class="artist-nav-name">${escapeHTML(a.artist)}</span>
          </a></li>`;
        }
      });
      list.innerHTML = html || `<li style="padding:10px;color:var(--text-muted);font-size:0.8rem;">No artists found</li>`;
    }

    function renderChips() {
      const container = document.getElementById("quickChipsContainer");
      let html = `<button class="chip-btn ${selectedFilter === 'ALL' ? 'active' : ''}" onclick="selectArtist('ALL')">All Artists</button>`;
      artistsData.forEach((a, idx) => {
        html += `<button class="chip-btn ${selectedFilter === idx.toString() ? 'active' : ''}" onclick="selectArtist('${idx}')">${escapeHTML(a.artist)}</button>`;
      });
      container.innerHTML = html;
    }

    function selectArtist(idx) {
      selectedFilter = idx;
      document.getElementById("searchInput").value = "";
      renderChips();
      renderSidebar();
      renderPlaylists();
      closeSidebar();
      
      if (idx !== "ALL") {
        setTimeout(() => {
          const el = document.getElementById(`artist-${idx}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }
    }

    const debounce = (fn, delay) => { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); }; };
    const handleGlobalSearch = debounce(() => renderPlaylists(document.getElementById("searchInput").value), 150);
    function filterSidebarArtists() { renderSidebar(document.getElementById("sidebarSearchInput").value); }
    
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("mobile-open");
      document.getElementById("sidebarOverlay").classList.toggle("active");
    }
    function closeSidebar() {
      document.getElementById("sidebar").classList.remove("mobile-open");
      document.getElementById("sidebarOverlay").classList.remove("active");
    }

    window.addEventListener("DOMContentLoaded", () => {
      initSystem();
      renderPlaylists();
    });
  </script>
</body>
</html>
