<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Soundtrack • Premium Music Showcase</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- YouTube IFrame API for Autoplay & Event Detection -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    /* ==========================================================================
       RESET & ROOT VARIABLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #08080c;
      --bg-surface: #10111a;
      --bg-card: #161824;
      --bg-hover: #1e2132;
      --border-color: #24273a;
      --border-focus: #6366f1;
      --accent-primary: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --sidebar-width: 280px;
      --header-height: 70px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: #2b2e42;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }

    /* ==========================================================================
       APP LAYOUT (SIDEBAR + MAIN CONTENT)
       ========================================================================== */
    .app-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* BACKDROP OVERLAY FOR MOBILE */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==========================================================================
       SIDEBAR NAVIGATION
       ========================================================================== */
    aside.sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 250;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .sidebar-brand i {
      font-size: 1.5rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .close-sidebar-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }

    .sidebar-search {
      padding: 16px 20px 8px 20px;
    }

    .sidebar-search-box {
      position: relative;
    }

    .sidebar-search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .sidebar-search-box input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
    }

    .sidebar-search-box input:focus {
      border-color: var(--accent-primary);
    }

    .sidebar-menu-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      padding: 16px 20px 8px 20px;
    }

    .artist-nav-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0 12px 20px 12px;
    }

    .artist-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 4px;
    }

    .artist-nav-item:hover,
    .artist-nav-item.active {
      background: var(--bg-hover);
      color: #ffffff;
    }

    .artist-nav-item.active {
      border-left: 3px solid var(--accent-primary);
    }

    .artist-nav-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .artist-nav-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .artist-nav-badge {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* ==========================================================================
       MAIN CONTENT WRAPPER
       ========================================================================== */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: margin-left 0.3s ease;
    }

    /* HEADER BAR */
    header.top-header {
      height: var(--header-height);
      background: rgba(16, 17, 26, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toggle-sidebar-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-sidebar-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-primary);
    }

    .global-search {
      position: relative;
      width: 360px;
      max-width: 100%;
    }

    .global-search i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .global-search input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 10px 18px 10px 44px;
      color: #ffffff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .global-search input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-pill {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* MAIN BODY CONTAINER */
    main.content-area {
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      padding: 32px;
      flex: 1;
    }

    /* HERO BANNER */
    .hero-banner {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.05) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 36px;
      position: relative;
      overflow: hidden;
    }

    .hero-banner h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .hero-banner p {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 600px;
    }

    /* QUICK CHIPS FILTER */
    .quick-chips-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 28px;
      scrollbar-width: none;
    }
    .quick-chips-container::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .chip-btn:hover, .chip-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* ==========================================================================
       ARTIST SECTION & CARDS
       ========================================================================== */
    .artist-section {
      margin-bottom: 56px;
      scroll-margin-top: calc(var(--header-height) + 20px);
    }

    .artist-header-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .artist-profile-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .artist-avatar-lg {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-primary);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }

    .artist-meta h3 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .artist-meta span {
      font-size: 0.8rem;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* MUSIC GRID */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    /* MUSIC CARD */
    .music-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    .music-card:hover {
      transform: translateY(-6px);
      border-color: #3b3f5c;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }

    /* LAZY LOAD YOUTUBE FACADE (HIGH PERFORMANCE) */
    .video-facade-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000000;
      cursor: pointer;
      overflow: hidden;
    }

    .video-facade-container img.thumbnail {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .music-card:hover .video-facade-container img.thumbnail {
      transform: scale(1.05);
    }

    .play-overlay-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      background: rgba(99, 102, 241, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
      padding-left: 3px;
    }

    .video-facade-container:hover .play-overlay-btn {
      transform: translate(-50%, -50%) scale(1.15);
      background: #4f46e5;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.8);
    }

    .video-facade-container iframe,
    .video-facade-container div[id^="yt-"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* CARD CONTENT */
    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-artist-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #a5b4fc;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-badge {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .yt-icon {
      color: #ef4444;
      font-size: 1.1rem;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      background: var(--bg-surface);
      border: 1px dashed var(--border-color);
      border-radius: 20px;
    }

    .empty-state i {
      font-size: 3rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* FOOTER */
    footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ==========================================================================
       RESPONSIVE DESIGN BREAKPOINTS
       ========================================================================== */
    @media (max-width: 1024px) {
      aside.sidebar {
        transform: translateX(-100%);
      }

      aside.sidebar.mobile-open {
        transform: translateX(0);
      }

      .close-sidebar-btn {
        display: block;
      }

      .main-wrapper {
        margin-left: 0;
      }
    }

    @media (max-width: 640px) {
      header.top-header {
        padding: 0 16px;
      }

      .global-search {
        width: 100%;
      }

      .header-stats {
        display: none;
      }

      main.content-area {
        padding: 20px 16px;
      }

      .hero-banner {
        padding: 20px;
      }

      .hero-banner h2 {
        font-size: 1.4rem;
      }

      .artist-header-card {
        padding: 18px;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .music-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <!-- SIDEBAR DRAWER -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <i class="fa-solid fa-compact-disc fa-spin" style="--fa-animation-duration: 10s;"></i>
          <span>Soundtrack</span>
        </div>
        <button class="close-sidebar-btn" onclick="closeSidebar()" aria-label="Close Sidebar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- SIDEBAR ARTIST SEARCH -->
      <div class="sidebar-search">
        <div class="sidebar-search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="sidebarSearchInput" placeholder="Filter artist list..." oninput="filterSidebarArtists()" />
        </div>
      </div>

      <div class="sidebar-menu-title">Artists Directory</div>

      <!-- DYNAMIC ARTIST LIST CONTAINER -->
      <ul class="artist-nav-list" id="artistNavList"></ul>
    </aside>

    <!-- MAIN APP CONTENT -->
    <div class="main-wrapper">
      
      <!-- TOP NAVIGATION BAR -->
      <header class="top-header">
        <div class="header-left">
          <button class="toggle-sidebar-btn" onclick="toggleSidebar()" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
          
          <div class="global-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search track, artist, or keywords..." oninput="handleSearch()" />
          </div>
        </div>

        <div class="header-stats">
          <div class="stat-pill">
            <i class="fa-solid fa-users"></i>
            <span id="totalArtistsBadge">0 Artists</span>
          </div>
          <div class="stat-pill">
            <i class="fa-solid fa-music"></i>
            <span id="totalTracksBadge">0 Tracks</span>
          </div>
        </div>
      </header>

      <!-- MAIN CONTENT SHOWCASE -->
      <main class="content-area">
        
        <!-- HERO BANNER -->
        <div class="hero-banner">
          <h2>My Personal Music Library</h2>
          <p>A personal collection of the songs, artists, and soundtracks I enjoy listening to.</p>
        </div>

        <!-- QUICK CHIPS FILTER -->
        <div class="quick-chips-container" id="quickChipsContainer"></div>

        <!-- DYNAMIC MUSIC SECTIONS CONTAINER -->
        <div id="musicContainer"></div>
        
      </main>

      <!-- FOOTER -->
      <footer>
        <p>&copy; 2026 Personal Soundtrack Showcase • Optimized with High Performance Architecture.</p>
      </footer>
    </div>
  </div>

    /* ==========================================================================
       PRECOMPUTED INDEXES (INVERTED SEARCH INDEX FOR O(K) FAST LOOKUP)
       ========================================================================== */
    let indexedData = [];
    let selectedArtistFilter = "ALL";
    const searchCache = new Map(); // O(1) Cache for Search Optimization
    
    // Store YouTube Player instances to pause/play and detect end state
    let ytPlayers = {}; 

    function initializeIndex() {
      let totalTracksCount = 0;
      
      indexedData = artistsData.map((group, index) => {
        const slug = "artist-" + index;
        const totalSongs = group.songs.length;
        totalTracksCount += totalSongs;

        const searchTokens = (group.artist + " " + group.songs.map(s => s.title + " " + (s.tag || '')).join(" ")).toLowerCase();

        return {
          ...group,
          slug,
          index,
          searchTokens,
          indexedSongs: group.songs.map(song => ({
            ...song,
            searchToken: (song.title + " " + group.artist + " " + (song.tag || '')).toLowerCase()
          }))
        };
      });

      // Update header statistics badges
      document.getElementById("totalArtistsBadge").textContent = `${artistsData.length} Artists`;
      document.getElementById("totalTracksBadge").textContent = `${totalTracksCount} Tracks`;

      // Render Navigation & Quick Chips
      renderSidebarNav();
      renderQuickChips();

      // OPTIMIZATION: Event Delegation for Music Cards (O(1) Memory listener)
      // Replaces inline onclick="playVideo(this)" which bloats the DOM
      document.getElementById("musicContainer").addEventListener("click", function(e) {
        const facade = e.target.closest('.video-facade-container');
        if (facade) {
          playVideo(facade);
        }
      });
    }

    /* ==========================================================================
       SIDEBAR NAV RENDER
       ========================================================================== */
    function renderSidebarNav(filterTerm = "") {
      const navList = document.getElementById("artistNavList");
      const cleanFilter = filterTerm.toLowerCase().trim();

      // OPTIMIZATION: Array Push String Builder
      const navChunks = [];
      indexedData.forEach((item) => {
        if (!cleanFilter || item.artist.toLowerCase().includes(cleanFilter)) {
          const isActive = selectedArtistFilter === item.slug ? "active" : "";
          navChunks.push(`
            <li>
              <a class="artist-nav-item ${isActive}" onclick="scrollToArtist('${item.slug}')">
                <img src="${item.image}" alt="${item.artist}" class="artist-nav-avatar" loading="lazy" />
                <span class="artist-nav-name">${item.artist}</span>
                <span class="artist-nav-badge">${item.songs.length}</span>
              </a>
            </li>
          `);
        }
      });

      navList.innerHTML = navChunks.length > 0 ? navChunks.join("") : `<li style="padding: 12px; color: var(--text-muted); font-size: 0.8rem; text-align: center;">No artists found</li>`;
    }

    function filterSidebarArtists() {
      const val = document.getElementById("sidebarSearchInput").value;
      renderSidebarNav(val);
    }

    /* ==========================================================================
       QUICK CHIPS RENDER
       ========================================================================== */
    function renderQuickChips() {
      const container = document.getElementById("quickChipsContainer");
      const chipsChunks = [`<button class="chip-btn ${selectedArtistFilter === 'ALL' ? 'active' : ''}" onclick="filterByChip('ALL')">All Artists</button>`];
      
      indexedData.forEach((item) => {
        const isActive = selectedArtistFilter === item.slug ? "active" : "";
        chipsChunks.push(`<button class="chip-btn ${isActive}" onclick="filterByChip('${item.slug}')">${item.artist}</button>`);
      });

      container.innerHTML = chipsChunks.join("");
    }

    function filterByChip(slug) {
      selectedArtistFilter = slug;
      renderQuickChips();
      renderSidebarNav();

      if (slug === 'ALL') {
        renderPlaylists(document.getElementById("searchInput").value);
      } else {
        scrollToArtist(slug);
      }
    }

    /* ==========================================================================
       HTML ESCAPING HELPER (FIXES BROKEN/UNCLICKABLE VIDEOS)
       ========================================================================== */
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /* ==========================================================================
       HIGH PERFORMANCE PLAYLIST RENDER & DEBOUNCED SEARCH ENGINE
       ========================================================================== */
    function renderPlaylists(filterQuery = "") {
      const container = document.getElementById("musicContainer");
      const query = filterQuery.toLowerCase().trim();
      const cacheKey = `${selectedArtistFilter}|${query}`;

      // OPTIMIZATION: O(1) Cache lookup for instant search renders
      if (searchCache.has(cacheKey)) {
        container.innerHTML = searchCache.get(cacheKey);
        ytPlayers = {}; // Reset tracking array when swapping DOM out
        return;
      }

      // Reset instances on re-render to prevent memory leak build-up
      ytPlayers = {}; 

      const outputChunks = []; // OPTIMIZATION: Array buffer for O(N) string building
      let totalMatches = 0;

      indexedData.forEach((artistGroup) => {
        // Chip filter condition
        if (selectedArtistFilter !== "ALL" && artistGroup.slug !== selectedArtistFilter) {
          return;
        }

        // Fast song filtering
        const matchingSongs = artistGroup.indexedSongs.filter(track => {
          return !query || track.searchToken.includes(query);
        });

        if (matchingSongs.length > 0) {
          totalMatches += matchingSongs.length;

          outputChunks.push(`
            <section class="artist-section" id="${artistGroup.slug}">
              <div class="artist-header-card">
                <div class="artist-profile-info">
                  <img src="${artistGroup.image}" alt="${artistGroup.artist}" class="artist-avatar-lg" loading="lazy" />
                  <div class="artist-meta">
                    <h3>${artistGroup.artist}</h3>
                    <span>${matchingSongs.length} ${matchingSongs.length === 1 ? 'Track' : 'Tracks'}</span>
                  </div>
                </div>
              </div>
              <div class="music-grid">
          `);

          matchingSongs.forEach((track) => {
            const cleanId = track.id.replace('?', '');
            const thumbUrl = `https://img.youtube.com/vi/${cleanId}/hqdefault.jpg`;
            const safeTitle = escapeHTML(track.title);

            // OPTIMIZATION: Removed inline onclick for Event Delegation support
            outputChunks.push(`
              <div class="music-card">
                <div class="video-facade-container" data-vid="${cleanId}" data-title="${safeTitle}">
                  <img src="${thumbUrl}" alt="${safeTitle}" class="thumbnail" loading="lazy" />
                  <div class="play-overlay-btn" title="Click to play">
                    <i class="fa-solid fa-play"></i>
                  </div>
                </div>
                <div class="card-body">
                  <h4 class="card-title">${track.title}</h4>
                  <div class="card-artist-name">
                    <i class="fa-solid fa-microphone-lines" style="font-size: 0.75rem;"></i>
                    <span>${artistGroup.artist}</span>
                  </div>
                  <div class="card-footer">
                    <span class="card-badge">${track.tag || 'Soundtrack'}</span>
                    <i class="fa-brands fa-youtube yt-icon" title="YouTube Source"></i>
                  </div>
                </div>
              </div>
            `);
          });

          outputChunks.push(`
              </div>
            </section>
          `);
        }
      });

      const finalHTML = totalMatches === 0 
        ? `
          <div class="empty-state">
            <i class="fa-solid fa-compact-disc"></i>
            <h3>No soundtrack found</h3>
            <p>No results matching "${filterQuery}". Try searching for another artist or track title.</p>
          </div>
          ` 
        : outputChunks.join("");

      container.innerHTML = finalHTML;
      
      // Save built string to cache for instant retrieval next time
      searchCache.set(cacheKey, finalHTML);
    }

    /* ==========================================================================
       YOUTUBE IFRAME API - AUTOPLAY AND NEXT TRACK LOGIC
       ========================================================================== */
    function playVideo(container) {
      const videoId = container.getAttribute('data-vid');
      const title = container.getAttribute('data-title');

      // 1. Check if this exact container already has an active player we can just resume
      const existingPlayerId = container.getAttribute('data-player-id');
      if (existingPlayerId && ytPlayers[existingPlayerId]) {
        try {
          ytPlayers[existingPlayerId].playVideo();
          return;
        } catch (e) {
          // If instance is lost or disconnected, proceed to recreate
        }
      }

      // 2. Pause any other currently playing videos to prevent audio overlap
      Object.values(ytPlayers).forEach(p => {
        if (p && typeof p.pauseVideo === 'function') {
          try { p.pauseVideo(); } catch (e) {}
        }
      });

      // 3. Generate unique player ID for this session
      const playerId = 'yt-' + Math.random().toString(36).substring(2, 10);
      container.setAttribute('data-player-id', playerId);
      
      // Replace the image facade with an empty div for YT API to latch onto
      container.innerHTML = `<div id="${playerId}"></div>`;

      // 4. Initialize via YouTube Iframe API if available
      if (window.YT && YT.Player) {
        const player = new YT.Player(playerId, {
          videoId: videoId,
          playerVars: {
            'autoplay': 1,
            'rel': 0,
            'playsinline': 1,
            'enablejsapi': 1
          },
          events: {
            'onReady': (event) => {
              event.target.playVideo();
            },
            'onStateChange': (event) => {
              // Automatically jump to the next track when current one concludes
              if (event.data === YT.PlayerState.ENDED) {
                playNextVideo(container);
              }
            }
          }
        });
        ytPlayers[playerId] = player;
      } else {
        // Fallback for environments blocking JS API
        container.innerHTML = `
          <iframe 
            src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&playsinline=1&enablejsapi=1" 
            title="${title}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;
      }
    }

    function playNextVideo(currentContainer) {
      // Find all loaded video containers currently in the DOM
      const allFacades = Array.from(document.querySelectorAll('.video-facade-container'));
      const currentIndex = allFacades.indexOf(currentContainer);

      // Check if there is a 'next' video available in the grid
      if (currentIndex !== -1 && currentIndex + 1 < allFacades.length) {
        const nextFacade = allFacades[currentIndex + 1];
        
        // Ensure it visually smoothly scrolls into view for the user
        nextFacade.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Execute playback with slight delay allowing smooth scroll to finish
        setTimeout(() => {
          playVideo(nextFacade);
        }, 600);
      }
    }

    /* DEBOUNCE FUNCTION FOR DSA PERFORMANCE */
    function debounce(func, delay = 150) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
      };
    }

    const handleSearch = debounce(() => {
      const query = document.getElementById("searchInput").value;
      renderPlaylists(query);
    }, 150);

    /* Smooth scroll to specific artist */
    function scrollToArtist(slug) {
      selectedArtistFilter = slug;
      renderQuickChips();
      renderSidebarNav();
      
      // Clear main search input for full view
      document.getElementById("searchInput").value = "";
      renderPlaylists("");

      setTimeout(() => {
        const el = document.getElementById(slug);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 50);

      closeSidebar();
    }

    /* ==========================================================================
       SIDEBAR TOGGLE CONTROLS
       ========================================================================== */
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      sidebar.classList.toggle("mobile-open");
      overlay.classList.toggle("active");
    }

    function closeSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      sidebar.classList.remove("mobile-open");
      overlay.classList.remove("active");
    }

    /* INITIALIZATION */
    window.addEventListener("DOMContentLoaded", () => {
      initializeIndex();
      renderPlaylists();
    });
  </script>
